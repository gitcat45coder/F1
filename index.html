<script>
        // --- EXACT ASSET CONFIGURATION PATHS ---
        // Updated to look right next to your index.html file!
        const ASSET_TRACK_PATH = 'track.stl';
        const ASSET_CAR_PATH = 'car.stl';

        let cachedCarGeometry = null;

        // --- PERFORMANCE CONSTANTS ---
        let BASE_MAX_SPEED = 340 / 3.6; 
        let CURRENT_MAX_SPEED = BASE_MAX_SPEED;
        const BASE_ACCEL = 14.5;    
        const BASE_DRAG = 0.08;      
        const BRAKE_FORCE = 30.0;     

        const TYRE_COMPOUNDS = {
            Soft: { name: 'Soft', color: '#ff3333', label: 'SOFT', gripDry: 1.05, gripDamp: 0.30, gripWet: 0.10, wearDry: 1.8, wearWet: 3.6 }
        };

        const WEATHER_STATES = {
            DRY:     { id: 'DRY',     name: 'Sunny',       color: '#ffcc00', sky: 0x13171c, sunIntensity: 0.8, rainDensity: 0 },
            DAMP:    { id: 'DAMP',    name: 'Light Rain',  color: '#00ffaa', sky: 0x0f1217, sunIntensity: 0.25, rainDensity: 900 },
            FLOODED: { id: 'FLOODED', name: 'Stormfall',   color: '#0088ff', sky: 0x050608, sunIntensity: 0.05, rainDensity: 2800 }
        };

        const MASTER_GRID_2025 = [
            { team: 'Ferrari', driver: 'C. Leclerc', color: 0xe60000 }, { team: 'Ferrari', driver: 'L. Hamilton', color: 0xe60000 },
            { team: 'Red Bull', driver: 'M. Verstappen', color: 0x0600ef }, { team: 'Red Bull', driver: 'L. Lawson', color: 0x0600ef },
            { team: 'McLaren', driver: 'L. Norris', color: 0xff8700 }, { team: 'McLaren', driver: 'O. Piastri', color: 0xff8700 },
            { team: 'Mercedes', driver: 'G. Russell', color: 0x00a19c }, { team: 'Mercedes', driver: 'K. Antonelli', color: 0x00a19c },
            { team: 'Aston Martin', driver: 'F. Alonso', color: 0x00594f }, { team: 'Aston Martin', driver: 'L. Stroll', color: 0x00594f },
            { team: 'Alpine', driver: 'P. Gasly', color: 0xff9ecb }, { team: 'Alpine', driver: 'J. Doohan', color: 0x0078c1 },
            { team: 'RB Racing', driver: 'Y. Tsunoda', color: 0x469bff }, { team: 'RB Racing', driver: 'I. Hadjar', color: 0x469bff },
            { team: 'Haas', driver: 'E. Ocon', color: 0xffffff }, { team: 'Haas', driver: 'O. Bearman', color: 0xcc0000 },
            { team: 'Williams', driver: 'A. Albon', color: 0x002f6c }, { team: 'Williams', driver: 'C. Sainz', color: 0x002f6c },
            { team: 'Kick Sauber', driver: 'N. Hulkenberg', color: 0x52e252 }, { team: 'Kick Sauber', driver: 'G. Bortoleto', color: 0x52e252 }
        ];

        let scene, camera, renderer, clock = new THREE.Clock();
        let car, sunLight, ambientLight;
        let rainParticles, rainGeometry;
        let gameActive = false;

        let currentWeather = WEATHER_STATES.DRY;
        let weatherTimer = 0;

        let totalDistanceTraveled = 0;
        let sessionTopSpeedKmh = 0;
        let uiRefreshTimer = 0;

        const keys = { w:false, a:false, s:false, d:false, ArrowUp:false, ArrowDown:false, ArrowLeft:false, ArrowRight:false, ' ':false };
        const playerProfile = { team: '', driver: '', teammate: '' };
        const aiCompetitors = [];

        const vehicle = {
            velocity: new THREE.Vector3(),
            speed: 0, heading: 0, steeringAngle: 0, targetSteeringAngle: 0, 
            teamColor: 0xff1801, 
            activeTyre: TYRE_COMPOUNDS.Soft,
            tyreHealth: 100.0,
            drsAvailable: false,
            drsActive: false
        };

        function selectDriver(team, selectedDriver, teammateDriver) {
            playerProfile.team = team;
            playerProfile.driver = selectedDriver;
            playerProfile.teammate = teammateDriver;

            document.getElementById('player-driver-name').innerText = selectedDriver.toUpperCase();
            document.getElementById('player-team-name').innerText = team + " Racing Team";
            
            if(team === 'Ferrari') vehicle.teamColor = 0xe60000;
            if(team === 'Red Bull') vehicle.teamColor = 0x0600ef;
            if(team === 'McLaren') vehicle.teamColor = 0xff8700;
            if(team === 'Mercedes') vehicle.teamColor = 0x00a19c;

            document.getElementById('menu-overlay').style.opacity = 0;
            setTimeout(() => {
                document.getElementById('menu-overlay').remove();
                document.getElementById('loading-screen').style.display = 'flex';
                initEngine();
            }, 500);
        }

        function createDriverTag(nameString, hexColor) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            if (ctx.roundRect) {
                ctx.roundRect(10, 10, 236, 44, 8); ctx.fill();
                ctx.fillStyle = hexColor;
                ctx.roundRect(10, 10, 8, 44, [8, 0, 0, 8]); ctx.fill();
            } else {
                ctx.fillRect(10, 10, 236, 44);
                ctx.fillStyle = hexColor;
                ctx.fillRect(10, 10, 8, 44);
            }
            ctx.font = 'bold 18px "Segoe UI", Arial, sans-serif';
            ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(nameString.toUpperCase(), 130, 32);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(3.5, 0.875, 1);
            sprite.position.set(0, 2.2, 0); 
            return sprite;
        }

        function initEngine() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(currentWeather.sky);
            scene.fog = new THREE.FogExp2(currentWeather.sky, 0.004);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            sunLight = new THREE.DirectionalLight(0xffffff, 0.9);
            sunLight.position.set(100, 250, 100);
            sunLight.castShadow = true;
            scene.add(sunLight);

            setupRainEngine();

            const loader = new THREE.STLLoader();
            
            // 1. Stream Track Mesh Data
            loader.load(ASSET_TRACK_PATH, function (trackGeometry) {
                trackGeometry.computeVertexNormals();
                trackGeometry.center();

                const trackMaterial = new THREE.MeshStandardMaterial({ color: 0x1c1f24, roughness: 0.85 });
                const trackMesh = new THREE.Mesh(trackGeometry, trackMaterial);
                
                trackMesh.rotation.x = -Math.PI / 2; 
                trackMesh.receiveShadow = true;
                scene.add(trackMesh);

                // 2. Stream Car Mesh Data
                loader.load(ASSET_CAR_PATH, function (carGeometry) {
                    carGeometry.computeVertexNormals();
                    carGeometry.center(); 
                    
                    cachedCarGeometry = carGeometry;

                    // Instantiating Player F1 Car Group
                    car = new THREE.Group();
                    const pMat = new THREE.MeshStandardMaterial({ color: vehicle.teamColor, roughness: 0.2, metalness: 0.6 });
                    const pMesh = new THREE.Mesh(cachedCarGeometry, pMat);
                    pMesh.castShadow = true;
                    pMesh.scale.set(0.05, 0.05, 0.05); 
                    car.add(pMesh);

                    const playerHex = `#${vehicle.teamColor.toString(16).padStart(6, '0')}`;
                    car.add(createDriverTag(playerProfile.driver, playerHex));
                    scene.add(car);

                    // Distribute AI cars down grid layout profiles
                    generateAICompetitorGrid();

                    // Swap out interface views
                    document.getElementById('loading-screen').remove();
                    document.getElementById('hud').style.display = 'flex';
                    document.getElementById('identity-card').style.display = 'flex';
                    document.getElementById('leaderboard-box').style.display = 'block';
                    document.getElementById('session-stats-box').style.display = 'block';

                    window.addEventListener('keydown', (e) => handleKey(e, true));
                    window.addEventListener('keyup', (e) => handleKey(e, false));
                    window.addEventListener('resize', onWindowResize);

                    gameActive = true;
                    animate();
                }, undefined, function(err){
                    document.getElementById('loading-text').innerText = "ERROR LOADING CAR.STL FROM TARGET FOLDERS.";
                    console.error(err);
                });
            }, undefined, function(err){
                document.getElementById('loading-text').innerText = "ERROR LOADING TRACK.STL FROM TARGET FOLDERS.";
                console.error(err);
            });
        }

        function generateAICompetitorGrid() {
            const filteredOpponents = MASTER_GRID_2025.filter(node => node.driver !== playerProfile.driver);

            filteredOpponents.forEach((profile, index) => {
                const aiGroup = new THREE.Group();
                const aiMat = new THREE.MeshStandardMaterial({ color: profile.color, roughness: 0.2, metalness: 0.6 });
                const aiMesh = new THREE.Mesh(cachedCarGeometry, aiMat);
                aiMesh.castShadow = true;
                aiMesh.scale.set(0.05, 0.05, 0.05);
                aiGroup.add(aiMesh);

                const aiHex = `#${profile.color.toString(16).padStart(6, '0')}`;
                aiGroup.add(createDriverTag(profile.driver, aiHex));

                const row = Math.floor(index / 2); 
                const side = index % 2 === 0 ? -1 : 1;
                const zPos = 35 + (row * 24);
                const xPos = side * 5;

                aiGroup.position.set(xPos, 0, zPos);
                scene.add(aiGroup);

                aiCompetitors.push({
                    mesh: aiGroup,
                    name: profile.driver,
                    team: profile.team,
                    colorHex: aiHex,
                    speed: 20 + (Math.random() * 5), 
                    baseMaxSpeed: (290 + (Math.random() * 30)) / 3.6,
                    speedBonus: 0.95 + (Math.random() * 0.10),
                    changeLaneTimer: Math.random() * 4,
                    targetXOffset: xPos,
                    distanceTracked: zPos 
                });
            });
        }

        function setupRainEngine() {
            const count = 12000; 
            rainGeometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            for(let i = 0; i < count * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 2000;
                positions[i+1] = Math.random() * 70; 
                positions[i+2] = (Math.random() - 0.5) * 2000;
            }
            rainGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const rainMat = new THREE.PointsMaterial({ color: 0x88aacc, size: 0.18, transparent: true, opacity: 0.0 });
            rainParticles = new THREE.Points(rainGeometry, rainMat);
            scene.add(rainParticles);
        }

        function handleKey(e, isPressed) {
            if (e.key in keys) keys[e.key] = isPressed;
            if (e.code in keys) keys[e.code] = isPressed;

            if (isPressed && e.key === ' ' && vehicle.drsAvailable && currentWeather.id === 'DRY') {
                vehicle.drsActive = !vehicle.drsActive;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function updateLeaderboard() {
            const allDrivers = [
                { name: playerProfile.driver, team: playerProfile.team, distance: totalDistanceTraveled, isPlayer: true, colorHex: `#${vehicle.teamColor.toString(16).padStart(6, '0')}` }
            ];
            
            aiCompetitors.forEach(ai => {
                allDrivers.push({ name: ai.name, team: ai.team, distance: ai.distanceTracked, isPlayer: false, colorHex: ai.colorHex });
            });

            allDrivers.sort((a, b) => b.distance - a.distance);

            const container = document.getElementById('leaderboard-rows-container');
            if(!container) return;
            
            container.innerHTML = '';
            allDrivers.slice(0, 10).forEach((drv, idx) => {
                const row = document.createElement('div');
                row.className = `leaderboard-row ${drv.isPlayer ? 'player-row' : ''}`;
                row.innerHTML = `
                    <div>
                        <span class="lane-flag" style="background:${drv.colorHex}"></span>
                        <span>${idx + 1}. ${drv.name}</span>
                    </div>
                    <span>${drv.team.toUpperCase()}</span>
                `;
                container.appendChild(row);
            });
        }

        function animate() {
            if (!gameActive) return;
            requestAnimationFrame(animate);

            const dt = clock.getDelta();
            if (dt <= 0) return;

            const thrust = keys.w || keys.ArrowUp;
            const brake = keys.s || keys.ArrowDown;
            const left = keys.a || keys.ArrowLeft;
            const right = keys.d || keys.ArrowRight;

            // Weather Update Intervals
            weatherTimer += dt;
            if (weatherTimer > 60.0) { 
                weatherTimer = 0;
                if (currentWeather.id === 'DRY') currentWeather = WEATHER_STATES.DAMP;
                else if (currentWeather.id === 'DAMP') currentWeather = WEATHER_STATES.FLOODED;
                else currentWeather = WEATHER_STATES.DRY;
            }

            const targetSky = new THREE.Color(currentWeather.sky);
            scene.background.lerp(targetSky, 1.2 * dt);
            scene.fog.color.lerp(targetSky, 1.2 * dt);
            
            sunLight.intensity += (currentWeather.sunIntensity - sunLight.intensity) * 1.2 * dt;

            let targetOpacity = 0.0;
            if (currentWeather.id === 'DAMP') targetOpacity = 0.55;
            if (currentWeather.id === 'FLOODED') targetOpacity = 0.95;
            rainParticles.material.opacity += (targetOpacity - rainParticles.material.opacity) * 2.0 * dt;

            if (rainParticles.material.opacity > 0.01) {
                const positions = rainGeometry.attributes.position.array;
                for(let i = 0; i < positions.length; i += 3) {
                    positions[i+1] -= (currentWeather.id === 'FLOODED' ? 52 : 36) * dt;
                    if (positions[i+1] < 0) {
                        positions[i] = (Math.random() - 0.5) * 2000;
                        positions[i+1] = 60 + Math.random() * 10;
                        positions[i+2] = (Math.random() - 0.5) * 2000;
                    }
                }
                rainGeometry.attributes.position.needsUpdate = true;
            }

            // DRS Check Parameters
            if (currentWeather.id !== 'DRY') {
                vehicle.drsAvailable = false;
                vehicle.drsActive = false;
            } else {
                if (Math.abs(car.position.z) > 50 && Math.abs(car.position.x) < 30) {
                    vehicle.drsAvailable = true;
                } else {
                    vehicle.drsAvailable = false;
                    vehicle.drsActive = false;
                }
            }
            if (brake) vehicle.drsActive = false;

            // Update DRS HUD Indicator Status
            const drsElem = document.getElementById('drs-indicator');
            if (drsElem) {
                if (currentWeather.id !== 'DRY') {
                    drsElem.className = 'disabled-weather';
                    drsElem.innerText = 'DRS OFF';
                } else if (vehicle.drsActive) {
                    drsElem.className = 'active';
                    drsElem.innerText = 'DRS ACT';
                } else if (vehicle.drsAvailable) {
                    drsElem.className = 'available';
                    drsElem.innerText = 'DRS AVAL';
                } else {
                    drsElem.className = '';
                    drsElem.innerText = 'DRS';
                }
            }

            // Handle track friction mechanics
            let activeGrip = 1.0;
            let activeWearRate = vehicle.activeTyre.wearDry;

            if (currentWeather.id === 'DRY') activeGrip = vehicle.activeTyre.gripDry;
            else if (currentWeather.id === 'DAMP') activeGrip = vehicle.activeTyre.gripDamp;
            else if (currentWeather.id === 'FLOODED') activeGrip = vehicle.activeTyre.gripWet;

            if (vehicle.speed > 1) {
                const dist = Math.abs(vehicle.speed) * dt;
                vehicle.tyreHealth -= dist * 0.0075 * activeWearRate;
                if (vehicle.tyreHealth < 0) vehicle.tyreHealth = 0;
            }

            // Update Tyre HUD elements
            const wearPctElem = document.getElementById('wear-pct');
            const wearFillElem = document.getElementById('tyre-wear-fill');
            if (wearPctElem) wearPctElem.innerText = `${Math.round(vehicle.tyreHealth)}%`;
            if (wearFillElem) {
                wearFillElem.style.width = `${vehicle.tyreHealth}%`;
                if(vehicle.tyreHealth > 60) wearFillElem.style.background = '#00ff44';
                else if(vehicle.tyreHealth > 30) wearFillElem.style.background = '#ffcc00';
                else wearFillElem.style.background = '#ff3333';
            }

            let cliffFactorLoss = 1.0;
            if (vehicle.tyreHealth < 40) {
                const healthRatio = vehicle.tyreHealth / 40.0;
                activeGrip *= (0.45 + healthRatio * 0.55); 
                cliffFactorLoss = 0.60 + (healthRatio * 0.40);
            }

            let activeDrag = BASE_DRAG;
            if (left || right) {
                const scrubFactor = 0.35 * (1.5 - activeGrip); 
                activeDrag += Math.abs(vehicle.steeringAngle) * scrubFactor;
            }

            if (vehicle.drsActive) {
                CURRENT_MAX_SPEED = BASE_MAX_SPEED * 1.12; 
                activeDrag *= 0.5; 
            } else {
                CURRENT_MAX_SPEED = BASE_MAX_SPEED;
            }

            if (thrust) {
                vehicle.speed += BASE_ACCEL * activeGrip * cliffFactorLoss * dt;
            } else if (brake) {
                vehicle.speed -= BRAKE_FORCE * dt;
            } else {
                vehicle.speed -= vehicle.speed * activeDrag * dt;
            }

            vehicle.speed = Math.max(0, Math.min(CURRENT_MAX_SPEED, vehicle.speed));
            
            const maxTurnAngle = 0.52 * activeGrip; 
            if (left) vehicle.targetSteeringAngle = maxTurnAngle;
            else if (right) vehicle.targetSteeringAngle = -maxTurnAngle;
            else vehicle.targetSteeringAngle = 0;

            vehicle.steeringAngle += (vehicle.targetSteeringAngle - vehicle.steeringAngle) * 4.5 * dt;

            if (vehicle.speed > 0.5) {
                vehicle.heading += vehicle.steeringAngle * (vehicle.speed / CURRENT_MAX_SPEED) * dt;
            }

            vehicle.velocity.set(Math.sin(vehicle.heading), 0, Math.cos(vehicle.heading)).multiplyScalar(vehicle.speed);
            car.position.addScaledVector(vehicle.velocity, dt);
            car.rotation.y = vehicle.heading;

            const scalarDistanceDelta = vehicle.speed * dt;
            totalDistanceTraveled += scalarDistanceDelta;

            const calculatedKmh = Math.round(vehicle.speed * 3.6);
            
            // HUD Panel values update
            const speedValElem = document.getElementById('speed-val');
            const gearValElem = document.getElementById('gear-val');
            const distValElem = document.getElementById('dist-val');
            const weatherDisplayElem = document.getElementById('weather-display');

            if (speedValElem) speedValElem.innerHTML = `${calculatedKmh} <span style="font-size:12px">km/h</span>`;
            if (gearValElem) {
                if (calculatedKmh === 0) gearValElem.innerText = 'N';
                else {
                    const estimatedGear = Math.min(8, Math.floor(calculatedKmh / 42) + 1);
                    gearValElem.innerText = estimatedGear;
                }
            }
            if (distValElem) distValElem.innerText = `${(totalDistanceTraveled / 1000).toFixed(2)} km`;
            if (weatherDisplayElem) {
                weatherDisplayElem.innerText = currentWeather.name;
                weatherDisplayElem.style.color = currentWeather.color;
            }

            if (calculatedKmh > sessionTopSpeedKmh) {
                sessionTopSpeedKmh = calculatedKmh;
                const topSpeedElem = document.getElementById('top-speed-val');
                if (topSpeedElem) topSpeedElem.innerText = `${sessionTopSpeedKmh} km/h`;
            }

            // Move AI along grid track paths
            aiCompetitors.forEach(ai => {
                let aiGripProfile = 1.0;
                if (currentWeather.id === 'DAMP') aiGripProfile = 0.75;
                if (currentWeather.id === 'FLOODED') aiGripProfile = 0.45;

                ai.changeLaneTimer -= dt;
                if (ai.changeLaneTimer <= 0) {
                    ai.changeLaneTimer = 3.0 + Math.random() * 4;
                    ai.targetXOffset = (Math.random() - 0.5) * 14;
                }

                let xDiff = ai.targetXOffset - ai.mesh.position.x;
                ai.mesh.position.x += xDiff * 2.0 * dt;

                let calculatedMax = ai.baseMaxSpeed * aiGripProfile;
                if (ai.speed < calculatedMax) {
                    ai.speed += 12.0 * aiGripProfile * dt;
                } else {
                    ai.speed -= 8.0 * dt;
                }
                ai.speed = Math.min(calculatedMax, ai.speed);

                ai.distanceTracked += ai.speed * ai.speedBonus * dt;
                
                // Keep visual movement relative or simple wrapping circuit loop
                ai.mesh.position.z = 50 - (ai.distanceTracked % 800); 
                ai.mesh.rotation.y = Math.PI; 
            });

            // UI Leaderboard refresh rates limiter
            uiRefreshTimer += dt;
            if(uiRefreshTimer > 0.35) {
                uiRefreshTimer = 0;
                updateLeaderboard();
            }

            // Camera follow system setup
            const relativeCameraOffset = new THREE.Vector3(0, 4.5, -11.0);
            const cameraOffset = relativeCameraOffset.applyMatrix4(car.matrixWorld);
            camera.position.x += (cameraOffset.x - camera.position.x) * 0.12;
            camera.position.y += (cameraOffset.y - camera.position.y) * 0.12;
            camera.position.z += (cameraOffset.z - camera.position.z) * 0.12;
            camera.lookAt(car.position.x, car.position.y + 1.0, car.position.z + 2.0);

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
